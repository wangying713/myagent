[project]
name = "agent-learning"
version = "0.1.0"
description = "从直接调 DeepSeek API 开始学 Agent 开发"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportUnusedCallResult = false
reportAny = false

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["I"]
