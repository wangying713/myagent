syntax = "proto3";

package saklay.http.agent;

option go_package = "saklay/ai/apps/interfaces/http/proto";

// ChatReq 对应 POST /api/agent/chat；省略或空字符串交给领域层使用默认问题。
message ChatReq {
  optional string question = 1;
}

// MessagesReq 对应 POST /api/agent/messages，一次执行固定两轮。
// HTTP 层另行保留字段是否出现：省略使用默认问题，显式空数组无效。
message MessagesReq {
  repeated string questions = 1;
}

// RunReq 对应 POST /api/agent/run，只允许调用已注册的工具。
// 省略问题或空字符串使用领域层默认问题。
message RunReq {
  optional string question = 1;
}

// ChatRsp 是普通聊天接口的业务响应，公共外层由 HTTP handler 包装。
message ChatRsp {
  string lesson = 1;
  bool completed = 2;
  string answer = 3;
  reserved 4;
  reserved "trace_id";
  bool telemetry_enabled = 5;
  int64 elapsed_ms = 6;
  int64 model_calls = 7;
  int64 tool_calls = 8;
  int64 known_tokens = 9;
  bool usage_complete = 10;
  repeated ExecutionStep steps = 11;
}

// MessagesRsp 是消息历史接口的业务响应，公共外层由 HTTP handler 包装。
message MessagesRsp {
  string lesson = 1;
  bool completed = 2;
  string answer = 3;
  reserved 4;
  reserved "trace_id";
  bool telemetry_enabled = 5;
  int64 elapsed_ms = 6;
  int64 model_calls = 7;
  int64 tool_calls = 8;
  int64 known_tokens = 9;
  bool usage_complete = 10;
  repeated ExecutionStep steps = 11;
}

// RunRsp 是受控工具循环接口的业务响应，公共外层由 HTTP handler 包装。
message RunRsp {
  string lesson = 1;
  bool completed = 2;
  string answer = 3;
  reserved 4;
  reserved "trace_id";
  bool telemetry_enabled = 5;
  int64 elapsed_ms = 6;
  int64 model_calls = 7;
  int64 tool_calls = 8;
  int64 known_tokens = 9;
  bool usage_complete = 10;
  repeated ExecutionStep steps = 11;
}

// Usage 保留用量是否已知；未提供与明确为零的含义不同。
message Usage {
  optional int64 prompt_tokens = 1;
  optional int64 completion_tokens = 2;
  optional int64 total_tokens = 3;
}

// ExecutionStep 是一次实际模型请求或工具执行的脱敏记录。
message ExecutionStep {
  string kind = 1;
  string name = 2;
  string request = 3;
  string response = 4;
  int64 elapsed_ms = 5;
  string finish_reason = 6;
  Usage usage = 7;
  string error = 8;
}
