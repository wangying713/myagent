[project]
name = "agent-toolkit"
version = "0.1.0"
description = "可复用的手写 Agent 循环、模型客户端、观测与会话工具"
readme = "agent_toolkit/README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langchain-core>=1,<2",
    "pydantic>=2.11.4,<3",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_toolkit"]
