[project]
name = "myagent"
version = "0.1.0"
description = "我们自己的 Agent 项目：把 SDK 当依赖装，业务代码分开写"
requires-python = ">=3.10"
dependencies = [
    "langfuse>=4.15.4",
    # 注意：这里是从 PyPI 装，不是克隆源码改。
    # 想读框架源码就去看隔壁 openai-agents-python/，那份是"参考资料"，不用改。
    "openai-agents>=0.22.3",
    "openinference-instrumentation-openai-agents>=2.4.1",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[project.scripts]
# 装完之后可以直接 `uv run myagent`，不用记模块路径
myagent = "myagent.runtime.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
